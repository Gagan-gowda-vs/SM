services:

  backend:
    build:
      context: ./backend
    container_name: dod-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      # DATABASE_URL: postgresql://dod_user:dod_password@postgres:5432/dod_db
      # REDIS_URL: redis://redis:6379
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: dod-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  postgres:
    image: postgres:16
    container_name: dod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dod-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: